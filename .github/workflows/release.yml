name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify tag matches project version
        run: |
          project_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${project_version}" = "${GITHUB_REF_NAME}"
      - name: Validate PyPI long-description source
        run: |
          uv run --isolated --no-project --with 'readme-renderer[md]==45.0' python .github/scripts/validate_pypi_readme.py
      - name: Run full gates
        run: make ci
      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/idcognito-synthworld/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  announce:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    # Its own job so `publish` keeps only `id-token: write`. Writing contents is a
    # wider grant than uploading a package and does not belong beside the OIDC step.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Extract the changelog section for this tag
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > release-notes.md <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None or not match.group(1).strip():
              raise SystemExit(
                  f"CHANGELOG.md has no content under a [{version}] heading. "
                  "A release nobody wrote down is a release nobody can read."
              )
          sys.stdout.write(match.group(1).strip() + "\n")
          PY
      - name: Create the draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "SynthWorld ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --generate-notes \
            dist/*
      - name: Publish and lock the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

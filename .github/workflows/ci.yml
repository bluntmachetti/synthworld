name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  capability-governance:
    name: Capability governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Enforce capability governance
        run: uv run python tools/generate_capabilities.py --check --require-tags

  public-boundary:
    name: Public consumer boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Enforce public consumer boundary
        run: uv run pytest --no-cov tests/test_public_repository_boundary.py

  pypi-readme:
    name: PyPI long description
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Validate configured PyPI README source
        run: |
          uv run --isolated --no-project --with 'readme-renderer[md]==45.0' python .github/scripts/validate_pypi_readme.py
      - name: Build distribution
        run: uv build --clear
      - name: Validate PyPI long description
        run: |
          uv run --isolated --no-project --with 'readme-renderer[md]==45.0' python - <<'PY'
          from email import policy
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          from readme_renderer.markdown import render

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              metadata_paths = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(
                      f"expected one METADATA file, found {len(metadata_paths)}"
                  )
              metadata_text = archive.read(metadata_paths[0]).decode("utf-8")

          metadata = Parser(policy=policy.default).parsestr(metadata_text)
          content_type = metadata.get("Description-Content-Type", "")
          if not content_type.lower().startswith("text/markdown"):
              raise SystemExit(
                  f"unexpected Description-Content-Type: {content_type!r}"
              )
          description = metadata.get_payload()
          source = Path("README.md").read_text(encoding="utf-8")
          if description.rstrip("\n") != source.rstrip("\n"):
              raise SystemExit("built long description differs from README.md")
          if render(description) is None:
              raise SystemExit("README.md failed Warehouse Markdown rendering")
          PY

  benchmark-registry:
    name: Benchmark registry governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate benchmark registry
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: uv run python tools/generate_benchmark_registry.py --check --require-tags --base-ref "$BASE_REF"

  quality:
    name: Python ${{ matrix.python-version }} full gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run full gates
        run: make ci
      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Docs impact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-impact:
    name: Docs dark preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect documentation impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "impacted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$PULL_REQUEST_BASE"
          if [[ -z "$base" ]]; then
            base="$PUSH_BEFORE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "impacted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" HEAD -- \
            docs AGENTIC_BENCHMARK.md BENCHMARKS.md CHANGELOG.md \
            DATA_DICTIONARY.md EVALUATION_KEY_CUSTODY.md GOLDEN_REVIEW.md \
            README.md ROADMAP.md USER_GUIDE.md \
            agent-authority-contract/README.md \
            authority-governance-contract/README.md \
            contextual-access-contract/README.md \
            continuous-assurance-contract/README.md \
            enterprise-identity-access-contract/README.md \
            huggingface/README.md \
            blume.config.ts package.json package-lock.json \
            tsconfig.json .nvmrc tools/audit_docs_dist.mjs \
            tools/prepare_docs_content.mjs \
            .github/workflows/docs-impact.yml; then
            echo "impacted=false" >> "$GITHUB_OUTPUT"
          else
            echo "impacted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pinned Node.js
        if: steps.impact.outputs.impacted == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up pinned npm
        if: steps.impact.outputs.impacted == 'true'
        run: npm install --global npm@10.9.0

      - name: Install locked documentation dependencies
        if: steps.impact.outputs.impacted == 'true'
        run: npm ci

      - name: Build and audit documentation
        if: steps.impact.outputs.impacted == 'true'
        run: npm run docs:check

      - name: Probe production-mode preview
        if: steps.impact.outputs.impacted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:preview -- --host 127.0.0.1 --port 4321 > /tmp/blume-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            response_code="$(curl --silent --show-error \
              --output /tmp/blume-preview.html --write-out '%{http_code}' \
              http://127.0.0.1:4321/synthworld/ || true)"
            if [[ "$response_code" == "200" ]] && \
              grep --fixed-strings --quiet "Documentation preview" /tmp/blume-preview.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/blume-preview.log
            exit 1
          fi

      - name: Upload dark-preview artifact
        if: steps.impact.outputs.impacted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthworld-docs-dark-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Report documentation impact
        if: always()
        shell: bash
        env:
          IMPACTED: ${{ steps.impact.outputs.impacted }}
        run: |
          if [[ "$IMPACTED" == "true" ]]; then
            echo "Documentation changed: the non-public preview build and audit were required; the artifact is uploaded only when those steps pass." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$IMPACTED" == "false" ]]; then
            echo "No documentation impact: dark-preview build was not required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Documentation impact detection did not produce a result." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
